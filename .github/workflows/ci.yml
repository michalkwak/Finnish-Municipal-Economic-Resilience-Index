name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -m "not network" --cov=resilience --cov-report=term-missing

      - name: Results are reproducible from committed data
        run: |
          uv run resilience build --results-dir /tmp/results
          diff -q results/finland_economic_resilience_index_long.csv /tmp/results/finland_economic_resilience_index_long.csv
